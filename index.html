let lang='tr',current=0;const gallery=document.querySelector('#gallery'),count=document.querySelector('#count'),lb=document.querySelector('#lightbox'),large=document.querySelector('#large'),largeVideo=document.querySelector('#largeVideo'),caption=document.querySelector('#caption');
